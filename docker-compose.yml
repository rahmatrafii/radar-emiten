services:
  db:
    image: postgres:16
    container_name: sentinel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-idx_sentinel}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-idx_sentinel}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sentinel_pgdata: